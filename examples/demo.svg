<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672.37 540.61" role="img" class="comb-svg" aria-labelledby="comb-title comb-desc">
<title id="comb-title">Shop</title>
<desc id="comb-desc">15 Combs: 10 Running, 1 Pending, 1 Blocked, 1 NeedsConfig, 1 Disabled, 1 Error</desc>
<style>.comb-svg{--comb-bg:#ffffff;--comb-border:#d0d7de;--comb-fg:#1f2328;--comb-muted:#59636e;--comb-edge:#57606a;--comb-running:#1a7f37;--comb-pending:#bf8700;--comb-blocked:#bc4c00;--comb-needsconfig:#8250df;--comb-disabled:#8c959f;--comb-error:#cf222e;--comb-stopped:#1b7c83;--comb-notdeployed:#0969da;--comb-unknown:#475569;--comb-tint:.13;--comb-tint-muted:.06;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}
@media (prefers-color-scheme:dark){.comb-svg{--comb-bg:#0d1117;--comb-border:#30363d;--comb-fg:#e6edf3;--comb-muted:#9198a1;--comb-edge:#9198a1;--comb-running:#3fb950;--comb-pending:#e3b341;--comb-blocked:#fb8f44;--comb-needsconfig:#a371f7;--comb-disabled:#6e7681;--comb-error:#f85149;--comb-stopped:#39c5cf;--comb-notdeployed:#58a6ff;--comb-unknown:#94a3b8;--comb-tint:.2;--comb-tint-muted:.09}}
.comb-svg .panel{fill:var(--comb-bg);stroke:var(--comb-border);stroke-width:1}
.comb-svg text{fill:var(--comb-fg)}
.comb-svg .heading{font-size:19.04px;font-weight:600}
.comb-svg .group-name{font-size:11.2px;font-weight:600;fill:var(--comb-muted)}
.comb-svg .group-rule{stroke:var(--comb-border);stroke-width:1}
.comb-svg .hex{fill:var(--comb-unknown);fill-opacity:var(--comb-tint);stroke:var(--comb-unknown);stroke-width:1.68;stroke-linejoin:round}
.comb-svg .phase-Running .hex{fill:var(--comb-running);stroke:var(--comb-running)}
.comb-svg .phase-Pending .hex{fill:var(--comb-pending);stroke:var(--comb-pending)}
.comb-svg .phase-Blocked .hex{fill:var(--comb-blocked);stroke:var(--comb-blocked)}
.comb-svg .phase-NeedsConfig .hex{fill:var(--comb-needsconfig);stroke:var(--comb-needsconfig)}
.comb-svg .phase-Disabled .hex{fill:var(--comb-disabled);stroke:var(--comb-disabled)}
.comb-svg .phase-Error .hex{fill:var(--comb-error);stroke:var(--comb-error)}
.comb-svg .phase-Stopped .hex{fill:var(--comb-stopped);stroke:var(--comb-stopped)}
.comb-svg .phase-NotDeployed .hex{fill:var(--comb-notdeployed);stroke:var(--comb-notdeployed)}
.comb-svg .phase-Unknown .hex{fill:var(--comb-unknown);stroke:var(--comb-unknown)}
.comb-svg .borrowed .hex{stroke-dasharray:6.16 4.48}
.comb-svg .disabled .hex{fill-opacity:var(--comb-tint-muted);stroke-opacity:.55}
.comb-svg .comb text{text-anchor:middle}
.comb-svg .name{font-size:12.32px;font-weight:500}
.comb-svg .phase{font-size:9.52px;fill:var(--comb-muted)}
.comb-svg .upstream{font-size:8.4px;font-style:italic;fill:var(--comb-muted)}
.comb-svg .reason{font-size:8.4px;fill:var(--comb-muted)}
.comb-svg .disabled text{fill:var(--comb-muted);fill-opacity:.8}
.comb-svg .dep{fill:none;stroke:var(--comb-edge);stroke-opacity:.5;stroke-width:1.4;stroke-linecap:round;pointer-events:none}
.comb-svg .arrow{fill:var(--comb-edge);fill-opacity:.5}
.comb-svg .dep-start{fill:var(--comb-edge);fill-opacity:.5;pointer-events:none}
.comb-svg a{cursor:pointer;text-decoration:none}
.comb-svg .legend text{font-size:10.64px;fill:var(--comb-muted)}
.comb-svg .legend .hex{stroke-width:1.12}
.comb-svg .legend .count{font-weight:600;fill:var(--comb-fg)}</style>
